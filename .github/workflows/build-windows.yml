name: Build Kozika Audio Studio for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "audio_engine.py"
      - "equalizer_apo.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows application
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name KozikaAudioStudio --collect-all numpy --collect-all scipy --collect-all sounddevice --collect-all soundfile app.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: KozikaAudioStudio-Windows
          path: dist/KozikaAudioStudio.exe
          if-no-files-found: error
          retention-days: 30
