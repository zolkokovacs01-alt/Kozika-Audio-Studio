name: Kozika Audio Studio checks and Windows build

on:
  push:
    branches:
      - main
      - fix/stable-audio-and-error5
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Run audio engine and Equalizer APO tests
        run: python -m unittest -v test_audio_engine test_equalizer_apo

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application and build dependencies
        run: python -m pip install --upgrade pip -r requirements.txt pyinstaller
      - name: Build standalone Windows application
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "Kozika Audio Studio" --collect-all sounddevice --collect-all soundfile --collect-all scipy app.py
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Kozika-Audio-Studio-Windows
          path: dist/Kozika Audio Studio.exe
          if-no-files-found: error
          retention-days: 30
