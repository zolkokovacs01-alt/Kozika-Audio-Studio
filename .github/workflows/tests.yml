name: Audio engine tests

on:
  push:
    branches:
      - main
      - fix/stable-audio-and-error5
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Run audio engine and Equalizer APO tests
        run: python -m unittest -v test_audio_engine test_equalizer_apo
