name: Kozika Audio Studio checks and Windows build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Run audio engine and Equalizer APO tests on Windows
        run: python -m unittest -v test_audio_engine test_equalizer_apo

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and build dependencies
        run: python -m pip install --upgrade pip -r requirements.txt pyinstaller
      - name: Build standalone Windows application
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "Kozika Audio Studio" --collect-all sounddevice --collect-all soundfile --collect-all scipy app.py
      - name: Verify Windows application was created
        shell: pwsh
        run: |
          $exe = "dist/Kozika Audio Studio.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "The Windows executable was not created: $exe"
          }
          if ((Get-Item -LiteralPath $exe).Length -le 0) {
            throw "The Windows executable is empty."
          }
          Write-Host "Verified Windows executable:"
          Get-Item -LiteralPath $exe | Select-Object Name, Length
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Kozika-Audio-Studio-Windows
          path: dist/Kozika Audio Studio.exe
          if-no-files-found: error
          retention-days: 30
